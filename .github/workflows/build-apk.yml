# Builds the Android app (APK) on GitHub's computers every time you upload changes.
# Download it from the repository's "Releases" page (on your phone) and install.
name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install tools
        run: npm install

      - name: Test the calculations
        run: npm test

      - name: Prepare the app files
        run: node build/prepare-www.mjs

      - name: Create the Android project
        run: npx cap add android

      - name: Add GPS permission, printing and version
        run: node build/patch-android.mjs

      - name: App icon
        continue-on-error: true
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#1E56A0' --splashBackgroundColor '#ECEFE6'

      - name: Copy app files into Android
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "GridNav-1.0.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: GridNav-APK
          path: GridNav-*.apk

      - name: Publish on the Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: GridNav 1.0.${{ github.run_number }}
          body: |
            Android app for testing. On your phone: download the .apk below, open it, allow "Install unknown apps", then Install.
            Your data stays on the phone. Installing a newer build updates the app and keeps your data.
          files: GridNav-*.apk
          make_latest: true
