<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F2417">
<meta name="description" content="Grid reference converter and land-navigation exercise planner">
<meta name="author" content="ASRAT">
<title>GridNav</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Libraries: the phone app (APK) carries its own copy in vendor/; the web version falls back to the internet. -->
<link rel="stylesheet" href="vendor/fonts.css">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<link rel="stylesheet" href="css/app.css">
<script>try{const t=localStorage.getItem('gridnav:theme');if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
</head>
<body>

<!-- ============ APP ============ -->
<div id="app" class="app">
  <header class="topbar">
    <button class="mapchip" id="mapChip" data-go="maps" aria-label="Change map">
      <svg aria-hidden="true"><use href="#i-sheet"/></svg>
      <span><small>Map</small><b id="mapChipName">No map yet</b></span>
    </button>
    <div class="top-actions">
      <button class="icon-btn" id="themeBtn" title="Day / night mode" aria-label="Day or night mode"><svg><use href="#i-moon"/></svg></button>
      <button class="icon-btn" id="acctBtn" title="Backup" aria-label="Backup and data"><svg><use href="#i-save"/></svg></button>
    </div>
  </header>

  <nav class="nav" id="nav" aria-label="Sections">
    <a class="brand" aria-hidden="true"><svg viewBox="0 0 48 48"><use href="#i-logo"/></svg></a>
    <button data-go="maps"><svg><use href="#i-sheet"/></svg><span>Maps</span></button>
    <button data-go="convert"><svg><use href="#i-swap"/></svg><span>Convert</span></button>
    <button data-go="points"><svg><use href="#i-pin"/></svg><span>Points</span></button>
    <button data-go="exercise"><svg><use href="#i-route"/></svg><span>Exercise</span></button>
    <button data-go="control"><svg><use href="#i-radar"/></svg><span>Control</span></button>
    <button data-go="map" class="only-mobile"><svg><use href="#i-globe"/></svg><span>Map</span></button>
  </nav>

  <main class="panel" id="panel">
    <!-- Views are rendered by app.js -->
    <section class="view" data-view="maps"></section>
    <section class="view" data-view="convert"></section>
    <section class="view" data-view="points"></section>
    <section class="view" data-view="exercise"></section>
    <section class="view" data-view="control"></section>
  </main>

  <div class="mapwrap" id="mapwrap">
    <div id="map"></div>
    <div class="readout" id="readout" hidden></div>
    <div class="maptools">
      <button class="icon-btn" id="locBtn" title="My position" aria-label="My position"><svg><use href="#i-gps"/></svg></button>
    </div>
    <div class="map-off" id="mapOff" hidden>The map needs an internet connection the first time. Conversions still work offline.</div>
  </div>
</div>

<div id="sheet" class="sheet-bg" hidden><div class="sheet" role="dialog" aria-modal="true" id="sheetBox"></div></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div id="printArea"></div>

<!-- ============ ICONS ============ -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-logo" viewBox="0 0 48 48"><rect x="3" y="3" width="42" height="42" rx="9" fill="var(--blue)"/><path d="M3 17h42M3 31h42M17 3v42M31 3v42" stroke="#fff" stroke-opacity=".35" stroke-width="1.5"/><path d="M24 9l5 15-5 15-5-15z" fill="#fff"/><path d="M24 9l5 15h-10z" fill="var(--signal)"/></symbol>
  <symbol id="i-sheet" viewBox="0 0 24 24"><path d="M4 5l5-2 6 2 5-2v16l-5 2-6-2-5 2z M9 3v16 M15 5v16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
  <symbol id="i-swap" viewBox="0 0 24 24"><path d="M4 8h14l-3-3 M20 16H6l3 3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s-6-6.2-6-11a6 6 0 1112 0c0 4.8-6 11-6 11z" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="10" r="2.2" fill="currentColor"/></symbol>
  <symbol id="i-flag" viewBox="0 0 24 24"><path d="M5 21V4m0 0h11l-2 4 2 4H5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-route" viewBox="0 0 24 24"><circle cx="5" cy="18" r="2.2" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="19" cy="6" r="2.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M7 17c6 0 2-8 10-10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-dasharray="2.5 2.5"/></symbol>
  <symbol id="i-radar" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3 9h18M3 14h18M9 4v16M15 4v16" stroke="currentColor" stroke-width="1.2" opacity=".6"/><rect x="15" y="9" width="6" height="5" fill="currentColor"/></symbol>
  <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3.5 12h17M12 3.5c3 3 3 14 0 17M12 3.5c-3 3-3 14 0 17" fill="none" stroke="currentColor" stroke-width="1.4"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 019.5 4a8 8 0 1010.5 10.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
  <symbol id="i-save" viewBox="0 0 24 24"><path d="M5 4h11l3 3v13H5z M8 4v5h7V4 M8 20v-6h8v6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
  <symbol id="i-share" viewBox="0 0 24 24"><circle cx="18" cy="5" r="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="6" cy="12" r="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="18" cy="19" r="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8.3 10.8l7.4-4.3M8.3 13.2l7.4 4.3" stroke="currentColor" stroke-width="1.8"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M4 21c1-4.5 4-6 8-6s7 1.5 8 6" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
  <symbol id="i-gps" viewBox="0 0 24 24"><circle cx="12" cy="12" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="2.2" fill="currentColor"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3" stroke="currentColor" stroke-width="1.8"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M16 8V5a1 1 0 00-1-1H5a1 1 0 00-1 1v10a1 1 0 001 1h3" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
  <symbol id="i-print" viewBox="0 0 24 24"><path d="M6 9V3h12v6M6 17H4v-7a1 1 0 011-1h14a1 1 0 011 1v7h-2M7 14h10v7H7z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5M4 9h10a6 6 0 010 12h-3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
</svg>

<script src="vendor/leaflet/leaflet.js"></script>
<script>if (!window.L) { document.write('<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"><\/script>'); }</script>
<script src="js/geo.js"></script>
<script src="js/routes.js"></script>
<script src="js/store.js"></script>
<script src="js/print.js"></script>
<script src="vendor/capacitor.js"></script>
<script src="js/native.js"></script>
<script src="js/app.js"></script>
</body>
</html>
